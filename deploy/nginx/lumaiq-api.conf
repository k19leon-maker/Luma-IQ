server {
    server_name api.lumaiq.ru 128.140.111.43;

    location ^~ /frontend/ {
        alias /var/www/lumaiq-frontend/;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
    }

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.lumaiq.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.lumaiq.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = api.lumaiq.ru) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name api.lumaiq.ru 128.140.111.43;
    return 404;
}

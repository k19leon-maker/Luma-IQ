services:
  postgres:
    image: postgres:16
    container_name: psy_boost_postgres
    environment:
      POSTGRES_DB: psy_boost
      POSTGRES_USER: psy_boost_user
      POSTGRES_PASSWORD: psy_boost_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: psy_boost_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/var/lib/redis/data

volumes:
  postgres_data:
  redis_data:
